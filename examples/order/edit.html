<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/style.css">
<title>Order $order.clordid</title>
<header>
  <h1>Order $order.clordid</h1>
  <nav><a href="/">Back to orders</a></nav>
</header>
<main>
  <p role="alert" $if="error">$error</p>
  <form method="post" action="/order_request">
    <input type="hidden" name="id" value="$order.id">
    <input type="hidden" name="order.version" value="$order.version">
    <label>Symbol <input name="symbol" value="$order.symbol" required></label>
    <label>Qty <input name="qty" type="number" min="1" step="1" value="$order.qty" required></label>
    <label>Price <input name="price" type="number" min="0" step="any" value="$order.price" required></label>
    <button>Save</button>
  </form>
  <footer>Version $order.version, last updated <time>$order.lastupdate</time></footer>
</main>
